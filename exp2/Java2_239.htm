```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f3f6;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            color: #ccc;
        }

        .content {
            padding: 30px;
        }

        .section-title {
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .bill {
            display: none;
            margin-top: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .bill-header {
            background: #f5f5f5;
            padding: 15px;
            font-weight: bold;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            background: #f5f5f5;
        }

        .discount {
            color: #218838;
        }

        .error {
            color: #dc3545;
            margin-top: 10px;
        }

        @media(max-width: 650px) {
            .row {
                flex-direction: column;
                gap: 10px;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SMART BILL</h1>
        <p>Simple Billing Calculator</p>
    </div>

    <div class="content">

        <h2 class="section-title">Enter Product Details</h2>

        <div class="row">

            <div class="field">
                <label for="customer">Customer Name</label>
                <input type="text" id="customer"
                       placeholder="Enter customer name">
            </div>

            <div class="field">
                <label for="product">Product Name</label>
                <input type="text" id="product"
                       placeholder="Enter product name">
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label for="price">Price per Item (₹)</label>
                <input type="number" id="price"
                       placeholder="Enter price">
            </div>

            <div class="field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity"
                       placeholder="Enter quantity">
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label for="discount">Discount</label>

                <select id="discount">
                    <option value="0">No Discount</option>
                    <option value="5">5% Discount</option>
                    <option value="10">10% Discount</option>
                    <option value="15">15% Discount</option>
                    <option value="20">20% Discount</option>
                </select>
            </div>

            <div class="field">
                <label for="gst">GST</label>

                <select id="gst">
                    <option value="0">No GST</option>
                    <option value="5">5% GST</option>
                    <option value="12">12% GST</option>
                    <option value="18">18% GST</option>
                </select>
            </div>

        </div>

        <button onclick="calculateBill()">
            Generate Bill
        </button>

        <div id="error" class="error"></div>


        <!-- BILL OUTPUT -->

        <div class="bill" id="bill">

            <div class="bill-header">
                BILL SUMMARY
            </div>

            <div id="billContent"></div>

        </div>

    </div>
</div>


<script>

    // -----------------------------------------
    // 1. var demonstration
    // -----------------------------------------

    var shopName = "SMART BILL";

    // var can be reassigned
    shopName = "SMART BILL - Billing System";


    // -----------------------------------------
    // 2. const demonstration
    // -----------------------------------------

    const currency = "₹";


    // -----------------------------------------
    // 3. let demonstration
    // -----------------------------------------

    let billGenerated = false;


    // -----------------------------------------
    // 4. Main Billing Function
    // -----------------------------------------

    function calculateBill() {

        // Accessing user input

        const customer =
            document.getElementById("customer").value.trim();

        const product =
            document.getElementById("product").value.trim();

        const price =
            Number(document.getElementById("price").value);

        const quantity =
            Number(document.getElementById("quantity").value);

        const discountRate =
            Number(document.getElementById("discount").value);

        const gstRate =
            Number(document.getElementById("gst").value);


        // -----------------------------------------
        // Input Validation
        // -----------------------------------------

        const error = document.getElementById("error");

        error.textContent = "";


        if (customer === "" || product === "") {

            error.textContent =
                "Please enter customer and product name.";

            return;
        }


        if (price <= 0 || quantity <= 0) {

            error.textContent =
                "Price and quantity must be greater than zero.";

            return;
        }


        // -----------------------------------------
        // Calculate Subtotal
        // -----------------------------------------

        let subtotal = price * quantity;


        // -----------------------------------------
        // Calculate Discount
        // -----------------------------------------

        let discountAmount =
            subtotal * discountRate / 100;


        let afterDiscount =
            subtotal - discountAmount;


        // -----------------------------------------
        // Calculate GST
        // -----------------------------------------

        let gstAmount =
            afterDiscount * gstRate / 100;


        // -----------------------------------------
        // Final Amount
        // -----------------------------------------

        let finalAmount =
            afterDiscount + gstAmount;


        // -----------------------------------------
        // OBJECT
        // -----------------------------------------

        const bill = {
            customer,
            product,
            price,
            quantity,
            subtotal,
            discountRate,
            discountAmount,
            gstRate,
            gstAmount,
            finalAmount
        };


        // -----------------------------------------
        // DESTRUCTURING
        // -----------------------------------------

        const {
            customer: customerName,
            product: productName,
            subtotal: totalBeforeDiscount,
            discountAmount: discount,
            gstAmount: gst,
            finalAmount: total
        } = bill;


        // -----------------------------------------
        // TEMPLATE LITERAL
        // -----------------------------------------

        const billHTML = `

            <div class="bill-row">
                <span>Customer</span>
                <strong>${customerName}</strong>
            </div>

            <div class="bill-row">
                <span>Product</span>
                <strong>${productName}</strong>
            </div>

            <div class="bill-row">
                <span>Price</span>
                <span>${currency}${price.toFixed(2)}</span>
            </div>

            <div class="bill-row">
                <span>Quantity</span>
                <span>${quantity}</span>
            </div>

            <div class="bill-row">
                <span>Subtotal</span>
                <span>${currency}${totalBeforeDiscount.toFixed(2)}</span>
            </div>

            <div class="bill-row discount">
                <span>Discount (${discountRate}%)</span>
                <span>- ${currency}${discount.toFixed(2)}</span>
            </div>

            <div class="bill-row">
                <span>GST (${gstRate}%)</span>
                <span>${currency}${gst.toFixed(2)}</span>
            </div>

            <div class="bill-row total">
                <span>Final Amount</span>
                <span>${currency}${total.toFixed(2)}</span>
            </div>

        `;


        // Display bill

        document.getElementById("billContent").innerHTML =
            billHTML;

        document.getElementById("bill").style.display =
            "block";


        // Update let variable

        billGenerated = true;


        console.log(`Bill generated for ${customerName}`);
    }

</script>

</body>
</html>
