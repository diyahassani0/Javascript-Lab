```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Admission Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f5;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #ccc;
        }

        form {
            padding: 30px;
        }

        .section-title {
            font-size: 19px;
            color: #222;
            margin: 20px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #333;
        }

        input.valid, select.valid {
            border: 2px solid #28a745;
        }

        input.invalid, select.invalid {
            border: 2px solid #dc3545;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            min-height: 16px;
        }

        .gender-box {
            display: flex;
            gap: 20px;
            padding: 10px 0;
        }

        .gender-box label {
            font-weight: normal;
        }

        .gender-box input {
            width: auto;
            margin-right: 5px;
        }

        .terms {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #444;
        }

        #successMessage {
            display: none;
            margin: 20px 30px 30px;
            padding: 20px;
            background: #e9f7ef;
            border-left: 5px solid #28a745;
            border-radius: 6px;
        }

        #successMessage h3 {
            color: #218838;
            margin-bottom: 10px;
        }

        #summary {
            line-height: 1.8;
        }

        @media(max-width: 650px) {
            .row {
                flex-direction: column;
                gap: 0;
            }

            body {
                padding: 10px;
            }

            form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>FITZONE GYM</h1>
        <p>Gym Admission & Membership Form</p>
    </div>

    <form id="gymForm">

        <h2 class="section-title">Personal Information</h2>

        <div class="row">

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <div class="error" id="nameError"></div>
            </div>

            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter age">
                <div class="error" id="ageError"></div>
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="example@gmail.com">
                <div class="error" id="emailError"></div>
            </div>

            <div class="field">
                <label for="phone">Mobile Number</label>
                <input type="text" id="phone" placeholder="10 digit mobile number">
                <div class="error" id="phoneError"></div>
            </div>

        </div>

        <div class="field">
            <label>Gender</label>

            <div class="gender-box">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <div class="error" id="genderError"></div>
        </div>


        <h2 class="section-title">Membership Details</h2>

        <div class="row">

            <div class="field">
                <label for="plan">Membership Plan</label>

                <select id="plan">
                    <option value="">Select Plan</option>
                    <option value="Monthly">Monthly - ₹1,500</option>
                    <option value="Quarterly">Quarterly - ₹4,000</option>
                    <option value="Half Yearly">Half Yearly - ₹7,000</option>
                    <option value="Yearly">Yearly - ₹12,000</option>
                </select>

                <div class="error" id="planError"></div>
            </div>

            <div class="field">
                <label for="goal">Fitness Goal</label>

                <select id="goal">
                    <option value="">Select Goal</option>
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="General Fitness">General Fitness</option>
                    <option value="Strength Training">Strength Training</option>
                </select>

                <div class="error" id="goalError"></div>
            </div>

        </div>

        <h2 class="section-title">Emergency & Account Details</h2>

        <div class="row">

            <div class="field">
                <label for="emergency">Emergency Contact</label>
                <input type="text" id="emergency" placeholder="10 digit contact number">
                <div class="error" id="emergencyError"></div>
            </div>

            <div class="field">
                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters">
                <div class="error" id="passwordError"></div>
            </div>

        </div>

        <div class="terms">
            <input type="checkbox" id="terms">
            <label for="terms">
                I agree to the gym rules and membership terms.
            </label>
        </div>

        <div class="error" id="termsError"></div>

        <button type="submit">Submit Admission Form</button>

    </form>


    <div id="successMessage">

        <h3>✓ Admission Successful!</h3>

        <div id="summary"></div>

    </div>

</div>


<script>

    // Accessing form fields using DOM methods
    const form = document.getElementById("gymForm");

    const nameInput = document.getElementById("name");
    const ageInput = document.getElementById("age");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const planInput = document.getElementById("plan");
    const goalInput = document.getElementById("goal");
    const emergencyInput = document.getElementById("emergency");
    const passwordInput = document.getElementById("password");
    const termsInput = document.getElementById("terms");


    // Function to display error
    function showError(input, errorId, message) {

        input.classList.add("invalid");
        input.classList.remove("valid");

        document.getElementById(errorId).textContent = message;
    }


    // Function to display successful validation
    function showSuccess(input, errorId) {

        input.classList.remove("invalid");
        input.classList.add("valid");

        document.getElementById(errorId).textContent = "";
    }


    // NAME VALIDATION - input event
    nameInput.addEventListener("input", function() {

        const name = nameInput.value.trim();

        if (name === "") {
            showError(nameInput, "nameError", "Name is required.");
        }
        else if (!/^[A-Za-z ]+$/.test(name)) {
            showError(nameInput, "nameError", "Only alphabets are allowed.");
        }
        else if (name.length < 3) {
            showError(nameInput, "nameError", "Name must contain at least 3 characters.");
        }
        else {
            showSuccess(nameInput, "nameError");
        }

    });


    // AGE VALIDATION - blur event
    ageInput.addEventListener("blur", function() {

        const age = Number(ageInput.value);

        if (ageInput.value === "") {
            showError(ageInput, "ageError", "Age is required.");
        }
        else if (age < 16 || age > 60) {
            showError(ageInput, "ageError", "Age must be between 16 and 60.");
        }
        else {
            showSuccess(ageInput, "ageError");
        }

    });


    // EMAIL VALIDATION - input event
    emailInput.addEventListener("input", function() {

        const email = emailInput.value.trim();

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {
            showError(emailInput, "emailError", "Email is required.");
        }
        else if (!emailPattern.test(email)) {
            showError(emailInput, "emailError", "Enter a valid email address.");
        }
        else {
            showSuccess(emailInput, "emailError");
        }

    });


    // PHONE VALIDATION - input event
    phoneInput.addEventListener("input", function() {

        const phone = phoneInput.value;

        if (!/^[0-9]*$/.test(phone)) {
            showError(phoneInput, "phoneError", "Only numbers are allowed.");
        }
        else if (phone.length !== 10) {
            showError(phoneInput, "phoneError", "Enter exactly 10 digits.");
        }
        else {
            showSuccess(phoneInput, "phoneError");
        }

    });


    // PLAN VALIDATION - change event
    planInput.addEventListener("change", function() {

        if (planInput.value === "") {
            showError(planInput, "planError", "Please select a membership plan.");
        }
        else {
            showSuccess(planInput, "planError");
        }

    });


    // FITNESS GOAL - change event
    goalInput.addEventListener("change", function() {

        if (goalInput.value === "") {
            showError(goalInput, "goalError", "Please select your fitness goal.");
        }
        else {
            showSuccess(goalInput, "goalError");
        }

    });


    // EMERGENCY CONTACT - input event
    emergencyInput.addEventListener("input", function() {

        const emergency = emergencyInput.value;

        if (!/^[0-9]*$/.test(emergency)) {
            showError(
                emergencyInput,
                "emergencyError",
                "Only numbers are allowed."
            );
        }
        else if (emergency.length !== 10) {
            showError(
                emergencyInput,
                "emergencyError",
                "Enter exactly 10 digits."
            );
        }
        else {
            showSuccess(emergencyInput, "emergencyError");
        }

    });


    // PASSWORD VALIDATION - input event
    passwordInput.addEventListener("input", function() {

        const password = passwordInput.value;

        if (password.length < 6) {
            showError(
                passwordInput,
                "passwordError",
                "Password must contain at least 6 characters."
            );
        }
        else {
            showSuccess(passwordInput, "passwordError");
        }

    });


    // TERMS VALIDATION - change event
    termsInput.addEventListener("change", function() {

        if (!termsInput.checked) {
            document.getElementById("termsError").textContent =
                "You must accept the terms.";
        }
        else {
            document.getElementById("termsError").textContent = "";
        }

    });


    // FORM SUBMISSION - submit event
    form.addEventListener("submit", function(event) {

        // Prevent page refresh
        event.preventDefault();

        // Trigger validation
        nameInput.dispatchEvent(new Event("input"));
        ageInput.dispatchEvent(new Event("blur"));
        emailInput.dispatchEvent(new Event("input"));
        phoneInput.dispatchEvent(new Event("input"));
        planInput.dispatchEvent(new Event("change"));
        goalInput.dispatchEvent(new Event("change"));
        emergencyInput.dispatchEvent(new Event("input"));
        passwordInput.dispatchEvent(new Event("input"));
        termsInput.dispatchEvent(new Event("change"));


        // Check whether invalid fields exist
        const invalidFields =
            document.querySelectorAll(".invalid");

        if (invalidFields.length > 0 || !termsInput.checked) {

            alert("Please correct the highlighted fields.");
            return;
        }


        // Accessing entered values
        const name = nameInput.value;
        const age = ageInput.value;
        const email = emailInput.value;
        const phone = phoneInput.value;
        const plan = planInput.value;
        const goal = goalInput.value;
        const emergency = emergencyInput.value;


        // Display admission summary
        document.getElementById("summary").innerHTML = `
            <strong>Name:</strong> ${name}<br>
            <strong>Age:</strong> ${age}<br>
            <strong>Email:</strong> ${email}<br>
            <strong>Mobile:</strong> ${phone}<br>
            <strong>Membership:</strong> ${plan}<br>
            <strong>Fitness Goal:</strong> ${goal}<br>
            <strong>Emergency Contact:</strong> ${emergency}
        `;


        document.getElementById("successMessage").style.display = "block";

        // Scroll to result
        document.getElementById("successMessage")
            .scrollIntoView({ behavior: "smooth" });

    });

</script>

</body>
</html>
